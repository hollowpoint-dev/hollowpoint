function hole(h){if(!h.face)return;const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);const m=new T.Mesh(hg,hm);m.position.copy(h.point).addScaledVector(n,.015);m.lookAt(h.point.clone().add(n));S.add(m);holes.push(m);if(holes.length>60)S.remove(holes.shift())}
function eject(){const p=new T.Vector3();guns[cur].getWorldPosition(p);const m=new T.Mesh(sg,new T.MeshBasicMaterial({color:0xd9a441,transparent:true}));m.scale.set(.7,.7,1.8);m.position.copy(p);S.add(m);const v=new T.Vector3(1,0,0).applyQuaternion(cam.quaternion).multiplyScalar(2+Math.random()*1.5);v.y=2.5+Math.random();parts.push({m,v,l:1.4,c:1})}
function tracer(a,b){const l=new T.Line(new T.BufferGeometry().setFromPoints([a,b]),new T.LineBasicMaterial({color:0xfff2b0,transparent:true,opacity:.9}));S.add(l);tracers.push({l,t:.07})}
function hitmark(hs){const h=$('hit');h.className='on'+(hs?' hs':'');setTimeout(()=>h.classList.remove('on'),60)}
function fire(t){const w=W[cur];if(t<nextFire||reloading)return;if(w.mag<=0){reload();return}
nextFire=t+w.rate;w.mag--;kick=1;flashT=.05;sfx(cur);pitch+=w.rec*.008;eject();
cam.getWorldDirection(fw);cam.getWorldPosition(cp);guns[cur].userData.mz.getWorldPosition(mp);
const tg=solids.concat(enemies.filter(e=>!e.dead).map(e=>e.g));
for(let i=0;i<w.n_;i++){dr.copy(fw);dr.x+=(Math.random()-.5)*w.sp;dr.y+=(Math.random()-.5)*w.sp;dr.z+=(Math.random()-.5)*w.sp;dr.normalize();
ray.set(cp,dr);ray.far=80;const h=ray.intersectObjects(tg,true)[0];let end;
if(h){end=h.point.clone();const e=h.object.userData.e;if(e){const hs=!!h.object.userData.head;e.hp-=w.d*(hs?2.5:1);e.fl=.08;hitmark(hs);spark(end,0xff2244);if(e.hp<=0&&!e.dead)kill(e,hs);else tone(hs?900:500,.05,'square',.12)}else{spark(end,0x9aa3c8);hole(h)}}
else end=cp.clone().addScaledVector(dr,60);
if(i<3)tracer(mp.clone(),end)}
if(w.mag<=0)reload()}
function reload(){const w=W[cur];if(reloading||w.mag==w.M||w.res<=0)return;reloading=1;rt=w.rl;tone(300,.1,'square',.1)}
function pick(i){if(i==cur||state!=='play')return;guns[cur].visible=false;cur=i;guns[i].visible=true;sw=1;reloading=0;rt=0;[...document.querySelectorAll('.sl')].forEach((s,j)=>s.classList.toggle('on',j==i));tone(500,.05,'square',.1)}
function popup(t,c){const d=document.createElement('div');d.className='pop';d.textContent=t;d.style.color=c;document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
function banner(t,ms=1800){const b=$('ban');b.textContent=t;b.style.opacity=1;clearTimeout(banner.t);banner.t=setTimeout(()=>b.style.opacity=0,ms)}
function nextWave(){wave++;spawnLeft=4+wave*2;spT=1;banner('Wave '+wave)}
// ---- flow
function reset(){decals.splice(0).forEach(d=>S.remove(d));holes.splice(0).forEach(m=>S.remove(m));enemies.splice(0).forEach(e=>S.remove(e.g));W.forEach(w=>{w.mag=w.M;w.res=[60,150,30][W.indexOf(w)]});P.x=P.z=0;P.hp=100;P.y=1.7;P.vx=P.vz=P.vy=0;yaw=pitch=0;score=kills=wave=0;waiting=false;reloading=0;pick(0);nextWave()}
let alive=false;
function start(){if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
if(AC&&AC.state==='suspended')AC.resume();
if(state!=='play'){reset();alive=true}state='play';paused=false;document.body.classList.add('play');$('menu').style.display='none';
try{const p=R.domElement.requestPointerLock();if(p&&p.catch)p.catch(()=>noLock=true)}catch(e){noLock=true}}
$('go').onclick=start;
document.addEventListener('pointerlockerror',()=>noLock=true);
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&state==='play'&&!noLock){paused=true;held=0;document.body.classList.remove('play');$('mt').textContent='Paused';$('sub').textContent='Click resume to jump back in.';$('go').textContent='Resume';$('menu').style.display='flex'}});
function die(){state='dead';alive=false;document.body.classList.remove('play');try{document.exitPointerLock()}catch(e){}
if(score>best){best=score;try{localStorage.setItem('hp_best',best)}catch(e){}}
$('mt').textContent='You fell';$('sub').textContent='Wave '+wave+' · '+kills+' kills · '+score+' points';$('go').textContent='Play again';$('best').textContent='Best score: '+best;$('menu').style.display='flex'}
$('best').textContent=best?'Best score: '+best:'';
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='KeyR')reload();if(e.code=='Digit1')pick(0);if(e.code=='Digit2')pick(1);if(e.code=='Digit3')pick(2);if(e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('mousemove',e=>{if(state!=='play'||paused)return;if(document.pointerLockElement||noLock){yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.45,Math.min(1.45,pitch))}});
addEventListener('mousedown',e=>{if(state!=='play'||paused||e.button)return;if(!document.pointerLockElement&&!noLock){try{const p=R.domElement.requestPointerLock();if(p&&p.catch)p.catch(()=>{noLock=true})}catch(x){noLock=true}}held=1;if(!W[cur].auto)fire(performance.now())});
addEventListener('mouseup',()=>held=0);
addEventListener('wheel',e=>pick((cur+(e.deltaY>0?1:2))%3));
// ---- HUD
const rc=$('rc').getContext('2d');
function hud(){const w=W[cur];$('hpn').textContent=Math.max(0,Math.ceil(P.hp));$('hpfill').style.width=Math.max(0,P.hp)+'%';$('ammo').innerHTML=(reloading?'···':w.mag)+'<small> / '+w.res+'</small>';$('ammo').style.color=w.mag<=w.M*.25?'var(--rd)':'';$('wn').textContent=w.n+(reloading?' – reloading':'');
$('wave').textContent=wave;$('score').textContent=score;$('kills').textContent=kills;$('vig').style.opacity=Math.max(vig,P.hp<30?.3+Math.sin(performance.now()*.008)*.15:0);const rl=$('rl');rl.style.opacity=reloading?1:0;rl.firstChild.style.width=(reloading?(1-rt/w.rl)*100:0)+'%';
rc.clearRect(0,0,116,116);rc.fillStyle='rgba(53,224,255,.12)';rc.beginPath();rc.arc(58,58,57,0,6.283);rc.fill();rc.strokeStyle='rgba(53,224,255,.4)';rc.beginPath();rc.arc(58,58,28,0,6.283);rc.stroke();
const s=Math.sin(yaw),c=Math.cos(yaw);for(const e of enemies){if(e.dead)continue;const dx=e.x-P.x,dz=e.z-P.z,rx=dx*c-dz*s,ry=dx*s+dz*c,px=58+rx*1.5,py=58+ry*1.5;if(Math.hypot(px-58,py-58)<54){rc.fillStyle=e.run?'#ffb02e':'#ff3d5a';rc.fillRect(px-2,py-2,4,4)}}
rc.fillStyle='#fff';rc.beginPath();rc.moveTo(58,52);rc.lineTo(54,62);rc.lineTo(62,62);rc.fill()}
// ---- update
const fwd=new T.Vector3();let bob=0,stepT=0;
function update(dt,t){
if(keys.ArrowLeft)yaw+=2*dt;if(keys.ArrowRight)yaw-=2*dt;if(keys.ArrowUp)pitch=Math.min(1.45,pitch+1.6*dt);if(keys.ArrowDown)pitch=Math.max(-1.45,pitch-1.6*dt);
const sp=keys.ShiftLeft||keys.ShiftRight?9.5:6,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mf=(keys.KeyW?1:0)-(keys.KeyS?1:0);const l=Math.hypot(mx,mf)||1;mx/=l;mf/=l;
const k=Math.min(1,dt*10);P.vx+=((rx*mx+fx*mf)*sp-P.vx)*k;P.vz+=((rz*mx+fz*mf)*sp-P.vz)*k;P.x+=P.vx*dt;P.z+=P.vz*dt;resolve(P,.45);
if(keys.Space&&P.y<=1.71)P.vy=7;P.vy-=20*dt;P.y=Math.max(1.7,P.y+P.vy*dt);if(P.y<=1.7)P.vy=Math.max(0,P.vy);
const spd=Math.hypot(P.vx,P.vz);bob+=spd*dt*1.6;if(spd>1&&P.y<=1.71){stepT+=dt*spd;if(stepT>2.8){stepT=0;tone(65,.07,'sine',.09)}}
cam.position.set(P.x,P.y+Math.sin(bob)*.04*(spd>1&&P.y<=1.71?1:0),P.z);cam.rotation.set(pitch+kick*.004,yaw,(Math.random()-.5)*vig*.06);
if(held&&W[cur].auto)fire(t);
if(reloading){rt-=dt*1000;if(rt<=0){const w=W[cur],n=Math.min(w.M-w.mag,w.res);w.mag+=n;w.res-=n;reloading=0}}
// gun anim
kick=Math.max(0,kick-dt*9);sw=Math.max(0,sw-dt*5);const g=guns[cur],pr=reloading?1-rt/W[cur].rl:0,ra=reloading?Math.sin(pr*Math.PI):0;
g.position.set(.24+Math.sin(bob*.5)*.008*(spd/6),-.22+Math.abs(Math.sin(bob))*.01*(spd/6)-ra*.18-sw*.3,-.45+kick*.09);g.rotation.set(kick*.12-ra*.9,0,ra*.3);
flashT-=dt;g.userData.fm.visible=flashT>0;g.userData.ml.intensity=flashT>0?3:0;dust.rotation.y+=dt*.02;g.userData.fm.scale.setScalar(.7+Math.random()*.8);
// waves
if(spawnLeft>0){spT-=dt;if(spT<=0&&enemies.filter(e=>!e.dead).length<12){spawn();spawnLeft--;spT=.9}}
else if(!waiting&&!enemies.length){waiting=true;between=3;banner('Wave '+wave+' cleared',2500);P.hp=Math.min(100,P.hp+30);W.forEach((w,i)=>w.res=Math.min(w.res+[24,60,10][i],[90,240,40][i]))}
if(waiting){between-=dt;if(between<=0){waiting=false;nextWave()}}
// enemies
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
if(e.dead){e.t+=dt;e.g.rotation.x=-Math.min(1.5,e.t*4);if(e.t>1.2){S.remove(e.g);enemies.splice(i,1)}continue}
const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz);e.g.rotation.y=Math.atan2(dx,dz);
if(d>1.3){e.x+=dx/d*e.sp*dt;e.z+=dz/d*e.sp*dt;resolve(e,.45);e.ph+=dt*e.sp*2.2;e.g.rotation.z=Math.sin(e.ph)*.05;if(Math.random()<dt*.12&&d<16)tone(70+Math.random()*30,.35,'sawtooth',.05);e.lL.rotation.x=Math.sin(e.ph)*.7;e.lR.rotation.x=-Math.sin(e.ph)*.7}
else{e.atk-=dt;e.aL.rotation.x=e.aR.rotation.x=-1.3+Math.sin(t*.02)*.5;if(e.atk<=0&&P.y<2.6){e.atk=.9;P.hp-=e.dmg;vig=1;tone(120,.15,'sawtooth',.3);if(P.hp<=0){die();return}}}
e.g.position.set(e.x,0,e.z);e.hb.scale.x=Math.max(.01,e.hp/e.mx);e.fl-=dt;e.m.emissive.setHex(e.fl>0?0xaa4444:0)}
// fx
vig=Math.max(0,vig-dt*1.6);
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.v.y-=12*dt;p.m.position.addScaledVector(p.v,dt);if(p.c&&p.m.position.y<.04){p.m.position.y=.04;p.v.y*=-.35;p.v.x*=.6;p.v.z*=.6}p.m.material.opacity=Math.max(0,p.l*2.5);if(p.l<=0){S.remove(p.m);p.m.material.dispose();parts.splice(i,1)}}
for(let i=tracers.length-1;i>=0;i--){const r=tracers[i];r.t-=dt;r.l.material.opacity=Math.max(0,r.t*12);if(r.t<=0){S.remove(r.l);r.l.geometry.dispose();tracers.splice(i,1)}}
hud()}
let last=performance.now();
(function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
if(state==='play'&&!paused)update(dt,t);else if(state==='menu'){cam.position.set(Math.sin(t*.0002)*20,6,Math.cos(t*.0002)*20);cam.rotation.set(-.2,Math.atan2(cam.position.x,cam.position.z),0)}
R.render(S,cam)})(last);
</script></body></html>
